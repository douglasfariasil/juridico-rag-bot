version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juridico_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./prompts:/app/prompts
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: juridico_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    environment:
      - API_URL=http://api:8000/chat
    depends_on:
      - api
    restart: unless-stopped
